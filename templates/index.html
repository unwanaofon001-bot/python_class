<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">

</head>
<body>
    <header>
        <h1>Virtual Task Manager Platform</h1>
        <p>Organize your work and stay on top of your game</p>
    </header>

    <main>
        <section id="summary">
            <h2>Task Overview:</h2>
            <div id="summary-cards">
                <div class="start-card">
                    <h3>Total number of tasks</h3>
                    <p id="total-count">0</p>
                </div>
                <div class="start-card">
                    <h3>Number of pending tasks</h3>
                    <p id="pending-count">0</p>
                </div>
                <div class="start-card">
                    <h3>Number of completed tasks</h3>
                    <p id="completed-count">0</p>
                </div>
            </div>
        </section>
        <section id="task-list">
            <h2>Your Task</h2>
            <label for="status-filter">Select filter</label>
            <select id="status-filter">
                <option value="All">All tasks</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
            </select>
            <div id="tasks-container">
                    <p>Loading tasks...</p>
            </div>
            
        </section>
    </main>
</body>
</html>
